[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-council"
version = "0.2.0rc1"
description = "A local-first multi-model collaboration orchestrator."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Model Council contributors"}]
dependencies = []

[project.scripts]
model-council = "model_council.cli:main"

[tool.setuptools.packages.find]
include = ["model_council*"]
